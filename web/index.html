<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SALM — live transcription</title>
<style>
/* Fonts are system stacks on purpose: this tool promises that nothing leaves
   the machine, and a webfont CDN would make an outbound request per load. */
:root{
  --paper:#E7ECF1; --surface:#fff; --ink:#0A1A2A; --muted:#5B6E82;
  --rule:#CBD6E0; --signal:#0E7C86; --repair:#6D3FC4;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --read:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#0A1219;--surface:#111C26;--ink:#E4ECF3;--muted:#8A9DB0;
        --rule:#22323F;--signal:#3BB4BD;--repair:#A585F0;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);
     height:100vh;display:flex;flex-direction:column}

header{display:flex;align-items:center;gap:1rem;padding:.85rem 1.4rem;
       background:var(--surface);border-bottom:1px solid var(--rule)}
.brand{font-weight:700;letter-spacing:.14em;font-size:.82rem}
.tagline{color:var(--muted);font-size:.82rem;flex:1}
@media (max-width:620px){.tagline{display:none}}

/* Listening indicator: bars move only while audio is actually being captured. */
.meter{display:flex;align-items:flex-end;gap:2px;height:16px;width:22px}
.meter i{flex:1;background:var(--rule);border-radius:1px;height:20%}
.live .meter i{background:var(--signal);animation:bounce .9s ease-in-out infinite}
.live .meter i:nth-child(2){animation-delay:.15s}
.live .meter i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{height:20%}50%{height:100%}}

button{font:inherit;font-weight:600;font-size:.85rem;padding:.5rem 1.05rem;
       border-radius:999px;border:1px solid var(--ink);background:var(--ink);
       color:var(--surface);cursor:pointer}
button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
button[disabled]{opacity:.4;cursor:not-allowed}
button.idle{background:transparent;color:var(--ink)}

main{flex:1;display:grid;grid-template-columns:1fr 20rem;min-height:0}
@media (max-width:860px){main{grid-template-columns:1fr}aside{display:none}}

#feed{overflow-y:auto;padding:2.2rem clamp(1.2rem,5vw,3.5rem)}
.utt{font-family:var(--read);font-size:clamp(1.08rem,1.9vw,1.4rem);
     line-height:1.62;margin:0 0 1.15rem;max-width:62ch;animation:rise .3s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* A repaired term keeps the raw hypothesis beside it, in mono, so the
   correction is auditable rather than invisible. */
.fix{color:var(--repair);border-bottom:1.5px solid var(--repair);font-weight:600}
.was{font-family:var(--mono);font-size:.62em;color:var(--muted);
     text-decoration:line-through;margin-left:.3em;vertical-align:.15em}
.exp{color:var(--signal);font-style:italic}

.empty{color:var(--muted);max-width:34ch;font-size:.9rem;line-height:1.6}
.empty b{display:block;font-size:1rem;color:var(--ink);margin-bottom:.35rem}

aside{background:var(--surface);border-left:1px solid var(--rule);
      overflow-y:auto;padding:1.4rem}
h2{font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;
   color:var(--muted);margin:0 0 .8rem;font-weight:700}
aside section+section{margin-top:1.9rem}
.row{display:flex;justify-content:space-between;align-items:baseline;
     gap:.6rem;padding:.4rem 0;border-bottom:1px solid var(--rule);font-size:.85rem}
.row .n{font-family:var(--mono);font-size:.75rem;color:var(--signal)}
.row small{display:block;color:var(--muted);font-size:.72rem;font-weight:400;line-height:1.35}
.repairline{font-family:var(--mono);font-size:.74rem;padding:.35rem 0;color:var(--muted)}
.repairline b{color:var(--repair);font-weight:600}
.none{color:var(--muted);font-size:.8rem}
footer{padding:.6rem 1.4rem;border-top:1px solid var(--rule);background:var(--surface);
       font-size:.75rem;color:var(--muted);font-family:var(--mono)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header id="hdr">
  <span class="brand">SALM</span>
  <span class="meter"><i></i><i></i><i></i></span>
  <span class="tagline">Local transcription, tuned to your firm&rsquo;s language</span>
  <button id="toggle">Start listening</button>
</header>

<main>
  <div id="feed">
    <p class="empty"><b>Nothing yet.</b>Start listening and speak. Jargon the
    recogniser almost got right is repaired, and acronyms are expanded the first
    time they&rsquo;re used.</p>
  </div>
  <aside>
    <section>
      <h2>Terms heard</h2>
      <div id="terms"><p class="none">None yet.</p></div>
    </section>
    <section>
      <h2>Repairs</h2>
      <div id="repairs"><p class="none">None yet.</p></div>
    </section>
  </aside>
</main>
<footer id="status">Connecting&hellip;</footer>

<script>
const feed=document.getElementById('feed'), hdr=document.getElementById('hdr'),
      toggle=document.getElementById('toggle'), statusEl=document.getElementById('status'),
      termsEl=document.getElementById('terms'), repairsEl=document.getElementById('repairs');
let ws, listening=false, glossary=[], counts=new Map(), repairs=[];

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rx  = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

fetch('/api/glossary').then(r=>r.json()).then(d=>{glossary=d.terms;});

function render(u){
  let html = esc(u.text);
  // Mark expansions first: they contain the bare acronym, so a correction mark
  // applied first would sit inside them and break the match.
  u.expansions.forEach(e=>{
    const whole = esc(e.canonical+' ('+e.expansion+')');
    html = html.replace(whole, '<span class="exp">'+whole+'</span>');
  });
  u.corrections.forEach(c=>{
    html = html.replace(new RegExp('\\b'+rx(esc(c.canonical))+'\\b'),
      '<span class="fix">'+esc(c.canonical)+'</span><span class="was">'+esc(c.heard)+'</span>');
  });
  const p=document.createElement('p'); p.className='utt'; p.innerHTML=html;
  const empty=feed.querySelector('.empty'); if(empty) feed.innerHTML='';
  feed.appendChild(p); feed.scrollTop=feed.scrollHeight;

  const seen=new Set();
  glossary.forEach(t=>{
    if(!seen.has(t.canonical) && new RegExp('\\b'+rx(t.canonical)+'\\b','i').test(u.text)){
      seen.add(t.canonical);
      counts.set(t.canonical,(counts.get(t.canonical)||0)+1);
    }
  });
  u.corrections.forEach(c=>repairs.unshift(c));
  paint();
}

function paint(){
  termsEl.innerHTML = counts.size===0 ? '<p class="none">None yet.</p>' :
    [...counts.entries()].sort((a,b)=>b[1]-a[1]).map(function(e){
      const term=e[0], n=e[1], t=glossary.find(g=>g.canonical===term);
      return '<div class="row"><span>'+esc(term)+
        (t&&t.expansion ? '<small>'+esc(t.expansion)+'</small>' : '')+
        '</span><span class="n">'+n+'</span></div>';
    }).join('');
  repairsEl.innerHTML = repairs.length===0 ? '<p class="none">None yet.</p>' :
    repairs.slice(0,14).map(r=>
      '<div class="repairline">'+esc(r.heard)+' &rarr; <b>'+esc(r.canonical)+'</b></div>').join('');
}

function setListening(on){
  listening=on;
  hdr.classList.toggle('live',on);
  toggle.textContent = on ? 'Stop listening' : 'Start listening';
  toggle.classList.toggle('idle',on);
}

function connect(){
  ws=new WebSocket('ws://'+location.host+'/ws');
  ws.onopen  = ()=>{toggle.disabled=false; statusEl.textContent='Ready. Audio stays on this machine.';};
  ws.onclose = ()=>{toggle.disabled=true; setListening(false);
                    statusEl.textContent='Disconnected. Retrying…'; setTimeout(connect,1500);};
  ws.onmessage = ev=>{
    const m=JSON.parse(ev.data);
    if(m.type==='utterance') render(m);
    else if(m.type==='status'){
      setListening(m.state==='listening');
      statusEl.textContent = m.state==='listening' ? 'Listening…'
        : 'Ready. Audio stays on this machine.';
    }
    else if(m.type==='saved') statusEl.textContent = m.path ? 'Transcript saved to '+m.path
                                                            : 'Nothing to save.';
    else if(m.type==='error') statusEl.textContent = 'Error: '+m.message;
  };
}
toggle.onclick=()=>{ ws.send(JSON.stringify({command: listening?'stop':'start'})); };
toggle.disabled=true; connect();
</script>
</body>
</html>
